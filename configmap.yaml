# CoolStore — non-sensitive runtime configuration (MigIQ containerize stage, TG 5.7/7.x)
# Consumed by deployment.yaml via envFrom.configMapRef.
# Apply into the target project: oc apply -f configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: coolstore-config
  labels:
    app.kubernetes.io/name: coolstore-quarkus
    app.kubernetes.io/part-of: coolstore
    app.kubernetes.io/managed-by: migiq-containerize
data:
  # %prod datasource URL (non-sensitive; credentials live in the coolstore-secrets Secret).
  # `postgres` is the headless Service defined in postgres.yaml.
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/coolstore"

  # Kafka bootstrap for the `orders` producer + `coolstore-orders`/`coolstore-inventory`
  # consumer groups (application.properties %prod / mp.messaging connector).
  # mig-deploy stage: this cluster has no AMQ Streams/Strimzi operator (no
  # kafka.strimzi.io CRDs) — Kafka runs as a plain single-broker KRaft Deployment
  # (apache/kafka:3.7.0) fronted by the `kafka` Service, so bootstrap is kafka:9092
  # instead of the Strimzi my-cluster-kafka-bootstrap:9092 from kafka.yaml.
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # OIDC — Keycloak realm `eap` (keycloak deployment provisions it).
  # mig-deploy stage: no OpenShift Route API on this cluster — Keycloak is exposed
  # via a NodePort Service (keycloak :30181, node IP 10.89.0.2). This URL is also
  # baked into the front-end keycloak.json at build time so the token issuer
  # matches between front-end adapter and backend OIDC validation (KI #2).
  QUARKUS_OIDC_AUTH_SERVER_URL: "http://10.89.0.2:30181/realms/eap"
  QUARKUS_OIDC_CLIENT_ID: "coolstore"
