# CoolStore — Secret TEMPLATE (MigIQ containerize stage)
#
# !! THIS FILE CONTAINS PLACEHOLDERS ONLY — NEVER COMMIT REAL CREDENTIALS !!
# Preferred: create the real Secret out-of-band so values never enter git:
#   oc create secret generic coolstore-secrets \
#     --from-literal=QUARKUS_DATASOURCE_USERNAME='coolstore' \
#     --from-literal=QUARKUS_DATASOURCE_PASSWORD='<db-password>' \
#     --from-literal=QUARKUS_OIDC_CREDENTIALS_SECRET='<keycloak-client-secret>' \
#     --from-literal=POSTGRESQL_USER='coolstore' \
#     --from-literal=POSTGRESQL_PASSWORD='<db-password>' \
#     --from-literal=KEYCLOAK_ADMIN='admin' \
#     --from-literal=KEYCLOAK_ADMIN_PASSWORD='<kc-admin-password>'
# If you apply this template instead, replace every CHANGE_ME value first.
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-secrets
  labels:
    app.kubernetes.io/name: coolstore-quarkus
    app.kubernetes.io/part-of: coolstore
    app.kubernetes.io/managed-by: migiq-containerize
type: Opaque
stringData:
  # Quarkus %prod datasource credentials (application.properties %prod block)
  QUARKUS_DATASOURCE_USERNAME: "CHANGE_ME"
  QUARKUS_DATASOURCE_PASSWORD: "CHANGE_ME"
  # Keycloak OIDC client `coolstore` secret — create the confidential client in
  # realm `eap` first (see CONTAINERIZATION_REPORT.md "Known gaps"); the realm
  # export only ships the public `eap-app` front-end client.
  QUARKUS_OIDC_CREDENTIALS_SECRET: "CHANGE_ME"
  # PostgreSQL supporting service (postgres.yaml) — must match the two values above
  POSTGRESQL_USER: "CHANGE_ME"
  POSTGRESQL_PASSWORD: "CHANGE_ME"
  # Keycloak bootstrap admin (keycloak.yaml)
  KEYCLOAK_ADMIN: "CHANGE_ME"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME"
