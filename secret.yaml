# CoolStore sensitive configuration (mig-containerize, task 6.1).
#
# *** PLACEHOLDER VALUES — DO NOT COMMIT REAL SECRETS ***
# For any real environment, create the Secret out-of-band instead of committing it:
#
#   oc create secret generic coolstore-secrets \
#     --from-literal=QUARKUS_DATASOURCE_JDBC_URL='jdbc:postgresql://postgres:5432/coolstore' \
#     --from-literal=QUARKUS_DATASOURCE_USERNAME='coolstore' \
#     --from-literal=QUARKUS_DATASOURCE_PASSWORD='<real-password>' \
#     --from-literal=OIDC_AUTH_SERVER_URL='https://keycloak.apps.example.com/realms/eap' \
#     --from-literal=OIDC_CLIENT_ID='coolstore' \
#     --from-literal=OIDC_CLIENT_SECRET='<real-secret>'
#
# Rotate the Keycloak client secret after importing realm-export.json
# (the exported value is a placeholder — see README.md security model).
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-secrets
  labels:
    app: coolstore
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Production PostgreSQL (matches database-statefulset.yaml defaults)
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/coolstore"
  QUARKUS_DATASOURCE_USERNAME: "coolstore"
  QUARKUS_DATASOURCE_PASSWORD: "CHANGE_ME_BEFORE_USE"
  # Keycloak OIDC (realm 'eap', confidential client 'coolstore')
  OIDC_AUTH_SERVER_URL: "https://keycloak.apps.example.com/realms/eap"
  OIDC_CLIENT_ID: "coolstore"
  OIDC_CLIENT_SECRET: "CHANGE_ME_BEFORE_USE"
