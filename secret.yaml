# CoolStore secrets — TEMPLATE ONLY (MigIQ containerize stage).
#
# SECURITY: create the real secrets out-of-band (oc create secret … / sealed
# secrets / external secret manager) so that no credential ever lands in Git.
# The Tekton secret-scan step (k8s/tekton-pipeline.yaml) fails the pipeline on
# findings. Placeholders below are intentionally non-credentials.
---
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-db
  namespace: coolstore-dev
  labels:
    app: coolstore
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  QUARKUS_DATASOURCE_USERNAME: REPLACE_ME
  QUARKUS_DATASOURCE_PASSWORD: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: coolstore-oidc
  namespace: coolstore-dev
  labels:
    app: coolstore
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
type: Opaque
stringData:
  # Keycloak issuer for realm `eap` (provisioned from realm-export.json).
  QUARKUS_OIDC_AUTH_SERVER_URL: https://keycloak:8443/realms/eap
  # Frontend public client (public-client: true — no client secret needed).
  QUARKUS_OIDC_CLIENT_ID: eap-app
