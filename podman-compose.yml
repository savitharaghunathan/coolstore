# CoolStore — local development stack (MigIQ containerize stage)
# Mirrors the OpenShift manifests: app (Dockerfile, %prod profile) + PostgreSQL
# + Kafka + Keycloak with realm `eap` imported.
# Usage: podman-compose up -d --build   (then http://localhost:8080)
# Note: the app container runs the Quarkus *prod* profile, so all integration
# settings come from the environment exactly as they do on OpenShift.
version: "3.8"

services:
  coolstore:
    build:
      context: .
      dockerfile: Dockerfile
    image: coolstore-quarkus:1.0.0
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/coolstore
      QUARKUS_DATASOURCE_USERNAME: coolstore
      QUARKUS_DATASOURCE_PASSWORD: coolstore
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/eap
      QUARKUS_OIDC_CLIENT_ID: coolstore
      QUARKUS_OIDC_CREDENTIALS_SECRET: CHANGE_ME
    depends_on:
      - postgres
      - kafka
      - keycloak

  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: coolstore
      POSTGRES_PASSWORD: coolstore
      POSTGRES_DB: coolstore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Single-node KRaft Kafka (no zookeeper)
  kafka:
    image: docker.io/apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Same image/version as keycloak.yaml; realm imported from the repo file
  keycloak:
    image: quay.io/keycloak/keycloak:20.0.5
    command: ["start", "--http-enabled=true", "--hostname-strict=false", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/eap-realm.json:ro

volumes:
  postgres-data:
  kafka-data:
