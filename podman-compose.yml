# CoolStore local development environment (mig-containerize, task 6.3 support).
# Mirrors the OpenShift deployment: app + PostgreSQL + Kafka + Keycloak.
#
#   podman-compose up -d
#   podman-compose logs -f app
#   podman-compose down            (add -v to reset the database)
#
# The app is reachable at http://localhost:8080, Keycloak at http://localhost:8081
# (realm 'eap' auto-imported from realm-export.json; admin/admin — dev only).
# Audit events are dropped unless a TCP sink listens on AUDIT_LOGGING_HOST:9999.
version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: coolstore:1.0.0
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/coolstore
      QUARKUS_DATASOURCE_USERNAME: coolstore
      QUARKUS_DATASOURCE_PASSWORD: coolstore
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/eap
      OIDC_CLIENT_SECRET: coolstore-client-secret
      AUDIT_LOGGING_HOST: audit-collector
      AUDIT_LOGGING_PORT: "9999"
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      - db
      - kafka
      - keycloak
    networks:
      - coolstore

  db:
    image: registry.redhat.io/rhel9/postgresql-15:latest
    environment:
      POSTGRESQL_USER: coolstore
      POSTGRESQL_PASSWORD: coolstore
      POSTGRESQL_DATABASE: coolstore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - coolstore

  kafka:
    # Single-node KRaft broker (Strimzi test image) for local development only
    image: quay.io/strimzi/kafka:latest-kafka-3.7.0
    command:
      - bash
      - -c
      - >-
        CLUSTER_ID=$(/opt/kafka/bin/kafka-storage.sh random-uuid) &&
        /opt/kafka/bin/kafka-storage.sh format --standalone -t "$$CLUSTER_ID"
        -c /opt/kafka/config/kraft/server.properties --ignore-formatted &&
        /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
        --override listeners=PLAINTEXT://:9092
        --override advertised.listeners=PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    networks:
      - coolstore

  keycloak:
    image: quay.io/keycloak/keycloak:20.0.5
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"
    networks:
      - coolstore

volumes:
  postgres-data:

networks:
  coolstore:
    driver: bridge
