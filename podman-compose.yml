# CoolStore local development environment — MigIQ containerize stage.
# Mirrors the OpenShift deployment (configmap.yaml / secret.yaml / deployment.yaml):
# same env-var contract, same health endpoints, same dependency topology.
#
# Usage:
#   podman-compose up -d
#   podman-compose logs -f app
#   podman-compose down          (add -v to reset volumes)
#
# Storefront: http://localhost:8080/  |  Health: /q/health/live, /q/health/ready
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/coolstore
      QUARKUS_DATASOURCE_USERNAME: coolstore
      QUARKUS_DATASOURCE_PASSWORD: coolstore
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8081/realms/eap
      QUARKUS_OIDC_CLIENT_ID: eap-app
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:8080
    depends_on:
      - db
      - kafka
      - keycloak
    networks:
      - coolstore-network

  db:
    image: registry.redhat.io/rhel9/postgresql-15:latest
    environment:
      POSTGRESQL_USER: coolstore
      POSTGRESQL_PASSWORD: coolstore
      POSTGRESQL_DATABASE: coolstore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - coolstore-network

  # Single-node Kafka (Strimzi image, KRaft mode) for local development.
  # AMQ Streams replaces this with the `my-cluster` Kafka cluster on OpenShift.
  kafka:
    image: quay.io/strimzi/kafka:latest-kafka-3.7.0
    command:
      - sh
      - -c
      - |
        export CLUSTER_ID=$$(/opt/kafka/bin/kafka-storage.sh random-uuid) && \
        /opt/kafka/bin/kafka-storage.sh format -t $$CLUSTER_ID -c /opt/kafka/config/kraft/server.properties && \
        /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties \
          --override advertised.listeners=PLAINTEXT://kafka:9092 \
          --override auto.create.topics.enable=true
    ports:
      - "9092:9092"
    networks:
      - coolstore-network

  # Keycloak with the `eap` realm imported from realm-export.json (TG4).
  keycloak:
    image: quay.io/keycloak/keycloak:20.0.5
    command: ["start-dev", "--http-port=8081", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8081"
    networks:
      - coolstore-network

volumes:
  postgres-data:

networks:
  coolstore-network:
    driver: bridge
