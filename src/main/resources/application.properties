# Quarkus Application Configuration
# Migrated from Java EE 7 (JBoss EAP 7.4) persistence.xml + web.xml

# ============================================================================
# DATABASE CONFIGURATION (from persistence.xml)
# ============================================================================
# NOTE: Original persistence.xml referenced java:jboss/datasources/CoolstoreDS (production datasource)
# For dev/test, using H2 in-memory. See [TODO(port)] below for production setup.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate ORM Configuration (from persistence.xml properties)
# [RULE: RULEBOOK.md §4, lines 131-140] Persistence config must match source semantics
# DB_CLOSE_DELAY=-1 prevents in-memory DB destruction between connection closes
# [CRITICAL FIX Reviewer 2#3]: Schema generation now environment-aware per rulebook requirement
%dev.quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
# Migrated Hibernate properties from persistence.xml:
quarkus.hibernate-orm.jdbc.use-get-generated-keys=false
quarkus.hibernate-orm.use-sql-comments=true

# ============================================================================
# SMALLRYE REACTIVE MESSAGING - KAFKA CONNECTOR (Amendment 2)
# ============================================================================
# DECISION: Apache Kafka as SmallRye Reactive Messaging connector
# Replaces ActiveMQ JMS messaging from Java EE 7
# See rulebook section "Messaging Connector Decision"

# Orders Channel - Outgoing (Producer)
# Used by: ShoppingCartOrderProcessor
# [CRITICAL FIX Reviewer 2#6]: Added Kafka producer delivery guarantees per rulebook Pattern 1A
mp.messaging.outgoing.orders-out.connector=smallrye-kafka
mp.messaging.outgoing.orders-out.topic=orders
mp.messaging.outgoing.orders-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.orders-out.acks=all
mp.messaging.outgoing.orders-out.enable.idempotence=true
mp.messaging.outgoing.orders-out.retries=3

# Orders Channel - Incoming (Consumer)
# Used by: OrderServiceMDB
# [CRITICAL FIX Reviewer 2#2]: Added auto.offset.reset per rulebook Pattern 1B (data loss prevention)
# [CRITICAL FIX Reviewer 2#5]: Added failure strategy and dead-letter queue per rulebook Pattern 1B
mp.messaging.incoming.orders.connector=smallrye-kafka
mp.messaging.incoming.orders.topic=orders
mp.messaging.incoming.orders.group.id=coolstore-orders
mp.messaging.incoming.orders.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders.auto.offset.reset=earliest
mp.messaging.incoming.orders.failure-strategy=dead-letter-queue
mp.messaging.incoming.orders.dead-letter-queue.topic=orders-dlq
# NOTE: @Incoming methods MUST be annotated with @Transactional (Amendment 1)
# because SmallRye Reactive Messaging does NOT auto-run in transactions.
# See rulebook Pattern 1B, lines 71-84 and "IMPORTANT: Transaction Model Difference"

# Inventory Notification Channel - Incoming (Consumer)
# Used by: InventoryNotificationMDB (formerly JMS MessageListener)
# [RULE: RULEBOOK.md "Messaging Connector Decision", line 212]
# Original behavior: subscribed to topic/orders as separate subscriber (topic broadcast)
# Kafka mapping: distinct consumer group to preserve pub/sub semantics (NOT load-balanced)
# [CRITICAL FIX Reviewer 2#2]: Added auto.offset.reset per rulebook Pattern 1B (data loss prevention)
# [CRITICAL FIX Reviewer 2#5]: Added failure strategy and dead-letter queue per rulebook Pattern 1B
mp.messaging.incoming.inventory.connector=smallrye-kafka
mp.messaging.incoming.inventory.topic=orders
mp.messaging.incoming.inventory.group.id=coolstore-inventory
mp.messaging.incoming.inventory.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory.auto.offset.reset=earliest
mp.messaging.incoming.inventory.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory.dead-letter-queue.topic=inventory-dlq
# NOTE: @Incoming("inventory") method in InventoryNotificationMDB MUST be @Transactional

# Kafka Bootstrap Servers (dev/test default; override per environment)
# [CRITICAL FIX Reviewer 2#4]: Using SmallRye standard configuration per rulebook lines 188-198
# MigIQ containerize stage (TG 3.8): broker URL externalized via KAFKA_BOOTSTRAP_SERVERS
# so OpenShift ConfigMaps can supply the in-cluster AMQ Streams bootstrap address —
# same env-var pattern as the %prod datasource and OIDC settings above.
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Disable dev services for local testing (no Docker available)
quarkus.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
quarkus.log.level=INFO
quarkus.log.category."com.redhat.coolstore".level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# ============================================================================
# SECURITY - KEYCLOAK / OIDC (TG 5.3 — closes TODO(port) #1)
# ============================================================================
# Keycloak realm `eap`, client `coolstore` (realm-export.json at repo root).
# Secret sourced from environment / OpenShift Secret — never in source (TG 5.4).
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/eap}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:coolstore}
quarkus.oidc.credentials.secret=${QUARKUS_OIDC_CREDENTIALS_SECRET:secret}
quarkus.oidc.tenant-enabled=true
# REST endpoints stay public by default (matches Java EE baseline @PermitAll
# catalog/cart browsing); checkout can be secured per-endpoint in a later stage
# once the front-end keycloak.json redirect URIs are aligned with the route.
quarkus.http.cors=true

# ============================================================================
# HTTP / REST ENDPOINTS
# ============================================================================
quarkus.http.port=8080
quarkus.application.name=coolstore
quarkus.application.version=1.0.0

# ============================================================================
# DEVELOPMENT PROFILE
# ============================================================================
%dev.quarkus.log.level=DEBUG
%dev.quarkus.datasource.jdbc=false
%dev.mp.messaging.outgoing.orders-out.connector=smallrye-in-memory
%dev.mp.messaging.incoming.orders.connector=smallrye-in-memory
%dev.mp.messaging.incoming.inventory.connector=smallrye-in-memory

# ============================================================================
# TEST PROFILE
# ============================================================================
# [CRITICAL FIX Reviewer 2#1]: Test profile required for messaging infrastructure per rulebook §8
# [CRITICAL FIX Reviewer 2#7]: Test profile H2 configuration for isolated database per rulebook §4,§8
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb-test;DB_CLOSE_DELAY=-1
%test.mp.messaging.outgoing.orders-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.orders.connector=smallrye-in-memory
%test.mp.messaging.incoming.inventory.connector=smallrye-in-memory

# ============================================================================
# PRODUCTION DATASOURCE (TG 5.1 — closes TODO(port) #2)
# ============================================================================
# PostgreSQL in %prod (Flyway V1_1/V1_2 is the schema authority; generation=validate
# is set above per profile). Credentials sourced from environment variables /
# OpenShift Secrets — never hardcoded (TG 5.4 secret externalization).
# Original source: java:jboss/datasources/CoolstoreDS
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/coolstore}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:coolstore}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}

