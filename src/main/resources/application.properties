# Quarkus Application Configuration

# Application
quarkus.application.name=coolstore-monolith

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=coolstore
quarkus.datasource.password=coolstore123
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/coolstore

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

# Artemis JMS
quarkus.artemis.url=tcp://localhost:61616
quarkus.artemis.username=admin
quarkus.artemis.password=admin

# Health
quarkus.health.extensions.enabled=true

# Metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true

# OIDC / Keycloak
quarkus.oidc.auth-server-url=http://localhost:8180/auth/realms/eap
quarkus.oidc.client-id=coolstore
quarkus.oidc.credentials.secret=secret

# Dev Services
quarkus.datasource.devservices.enabled=true
quarkus.artemis.devservices.enabled=true

# HTTP
quarkus.http.port=8080
quarkus.http.test-port=8081

# Log
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.category."com.redhat.coolstore".level=INFO
