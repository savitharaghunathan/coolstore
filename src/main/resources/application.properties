# ============================================================================
# CoolStore Quarkus Application Configuration
# Migrated from Java EE 7 (JBoss EAP 7.4) persistence.xml + web.xml
# Profile separation (TG5): %dev/%test = H2 + in-memory Kafka; %prod = PostgreSQL + Kafka
# ============================================================================

# --- Database (dev/test default: H2 in-memory; DB_CLOSE_DELAY=-1 per persistence.xml) ---
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Production datasource (TG5.1): PostgreSQL, credentials injected via env vars
# (OpenShift Secret coolstore-db) — no credentials in Git.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/coolstore}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:coolstore}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:}

# --- Hibernate ORM (schema generation per profile; %prod validates Flyway schema) ---
%dev.quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.jdbc.use-get-generated-keys=false
quarkus.hibernate-orm.use-sql-comments=true

# --- Flyway (TG5.2): %prod schema + seed data via V1_1/V1_2 (PostgreSQL dialect:
# int4/int8/float8/text are native PG types; hibernate_sequence created for
# OrderItem GenerationType.SEQUENCE). Replaces the deleted DataBaseMigrationStartup
# bean (duplicate migration path removed). %dev/%test use Hibernate DDL on H2. ---
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.flyway.baseline-on-migrate=true
%dev.quarkus.flyway.migrate-at-start=false
%test.quarkus.flyway.migrate-at-start=false

# ============================================================================
# SMALLRYE REACTIVE MESSAGING - KAFKA CONNECTOR (Amendment 2)
# ============================================================================
# Orders channel - outgoing producer (ShoppingCartOrderProcessor, Pattern 1A)
mp.messaging.outgoing.orders.connector=smallrye-kafka
mp.messaging.outgoing.orders.topic=orders
mp.messaging.outgoing.orders.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.orders.acks=all
mp.messaging.outgoing.orders.enable.idempotence=true
mp.messaging.outgoing.orders.retries=3

# Orders channel - incoming consumer (OrderServiceMDB, group coolstore-orders, Pattern 1B)
mp.messaging.incoming.orders.connector=smallrye-kafka
mp.messaging.incoming.orders.topic=orders
mp.messaging.incoming.orders.group.id=coolstore-orders
mp.messaging.incoming.orders.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders.auto.offset.reset=earliest
mp.messaging.incoming.orders.failure-strategy=dead-letter-queue
mp.messaging.incoming.orders.dead-letter-queue.topic=orders-dlq

# Inventory channel - incoming consumer (InventoryNotificationMDB, group
# coolstore-inventory; distinct group preserves JMS topic broadcast semantics)
mp.messaging.incoming.inventory.connector=smallrye-kafka
mp.messaging.incoming.inventory.topic=orders
mp.messaging.incoming.inventory.group.id=coolstore-inventory
mp.messaging.incoming.inventory.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory.auto.offset.reset=earliest
mp.messaging.incoming.inventory.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory.dead-letter-queue.topic=inventory-dlq

# Kafka bootstrap servers (TG6.5): env-overridable for OpenShift / AMQ Streams
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Dev services disabled (no container runtime in local/test environments)
quarkus.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

# ============================================================================
# SECURITY - KEYCLOAK / OIDC (TG4.2; realm `eap`, frontend public client `eap-app`)
# ============================================================================
# Bearer-token validation for /services endpoints. Values env-injected on OpenShift
# (Secret coolstore-oidc). TG4.1: ProductEndpoint = @PermitAll (browse);
# CartEndpoint + OrderEndpoint = @RolesAllowed("user") (cart mutation + checkout).
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/eap}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:eap-app}
quarkus.oidc.token.principal-claim=preferred_username
# Dev/test escape hatch (TG4.2): OIDC disabled locally; security tests use
# quarkus-test-security @TestSecurity identities instead of a live Keycloak.
%dev.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.tenant-enabled=false

# CORS (TG4.4): allow the AngularJS frontend origin to call /services/*
quarkus.http.cors=true
quarkus.http.cors.origins=${QUARKUS_HTTP_CORS_ORIGINS:http://localhost:8080}

# ============================================================================
# HTTP / REST / LOGGING
# ============================================================================
quarkus.http.port=8080
quarkus.application.name=coolstore
quarkus.application.version=1.0.0
quarkus.log.level=INFO
quarkus.log.category."com.redhat.coolstore".level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
%dev.quarkus.log.level=DEBUG

# ============================================================================
# PROFILES
# ============================================================================
# Dev: H2 + in-memory messaging (JDBC datasource kept enabled — the prior
# `%dev.quarkus.datasource.jdbc=false` line was removed; it disabled the dev DB)
%dev.mp.messaging.outgoing.orders.connector=smallrye-in-memory
%dev.mp.messaging.incoming.orders.connector=smallrye-in-memory
%dev.mp.messaging.incoming.inventory.connector=smallrye-in-memory

# Test: isolated H2 + in-memory messaging
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb-test;DB_CLOSE_DELAY=-1
%test.mp.messaging.outgoing.orders.connector=smallrye-in-memory
%test.mp.messaging.incoming.orders.connector=smallrye-in-memory
%test.mp.messaging.incoming.inventory.connector=smallrye-in-memory
