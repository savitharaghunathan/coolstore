# Quarkus Configuration for Coolstore Monolith
# Migrated from Java EE 7 to Quarkus 3

# Application Configuration
quarkus.application.name=coolstore-monolith

# HTTP Configuration
quarkus.http.port=8080

# REST/JAX-RS Configuration
# Migrated from @ApplicationPath("/services")
quarkus.resteasy-reactive.path=/services

# Datasource Configuration
# Migrated from JNDI: java:jboss/datasources/CoolstoreDS
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate ORM Configuration
# Migrated from persistence.xml
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.log.jdbc-warnings=true
quarkus.hibernate-orm.jdbc.statement-fetch-size=10
quarkus.hibernate-orm.jdbc.statement-batch-size=10

# Flyway Configuration
# Database migrations from db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# Artemis JMS Configuration
# For Message-Driven Beans migration
quarkus.artemis.url=tcp://localhost:61616
quarkus.artemis.username=admin
quarkus.artemis.password=admin

# OIDC/Keycloak Configuration
# Migrated from keycloak.json
quarkus.oidc.auth-server-url=http://localhost:8081/realms/eap
quarkus.oidc.client-id=eap-app
quarkus.oidc.application-type=web-app
quarkus.oidc.tls.verification=none

# Logging Configuration
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.redhat.coolstore".level=DEBUG

# Dev Mode Configuration
%dev.quarkus.http.port=8080
%dev.quarkus.hibernate-orm.log.sql=true

# Test Configuration
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.hibernate-orm.database.generation=drop-and-create
