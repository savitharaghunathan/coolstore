# Quarkus Application Configuration
# Migrated from Java EE 7 (JBoss EAP 7.4) persistence.xml + web.xml

# ============================================================================
# DATABASE CONFIGURATION (from persistence.xml)
# ============================================================================
# Dev/test default: H2 in-memory. Production: PostgreSQL via env injection (TG5.1).
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate ORM Configuration (from persistence.xml properties)
# [RULE: RULEBOOK.md §4, lines 131-140] Persistence config must match source semantics
# [CRITICAL FIX Reviewer 2#3]: Schema generation environment-aware per rulebook requirement
%dev.quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.jdbc.use-get-generated-keys=false
quarkus.hibernate-orm.use-sql-comments=true

# ============================================================================
# FLYWAY SCHEMA MANAGEMENT (TG5.2)
# ============================================================================
# Flyway owns the schema; Hibernate only validates in prod (no generation conflict).
# Migrations: db/migration/V1_1__CreateSchema.sql + V1_2__AddInitialData.sql
# (original CoolstoreDS was PostgreSQL — column types verified compatible).
quarkus.flyway.migrate-at-start=true

# ============================================================================
# SMALLRYE REACTIVE MESSAGING - KAFKA CONNECTOR (Amendment 2)
# ============================================================================
# Orders Channel - Outgoing (Producer) - ShoppingCartOrderProcessor
# [CRITICAL FIX Reviewer 2#6]: Kafka producer delivery guarantees (rulebook Pattern 1A)
mp.messaging.outgoing.orders.connector=smallrye-kafka
mp.messaging.outgoing.orders.topic=orders
mp.messaging.outgoing.orders.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.orders.acks=all
mp.messaging.outgoing.orders.enable.idempotence=true
mp.messaging.outgoing.orders.retries=3

# Orders Channel - Incoming (Consumer) - OrderServiceMDB
# [CRITICAL FIX Reviewer 2#2, #5]: auto.offset.reset + DLQ (rulebook Pattern 1B)
mp.messaging.incoming.orders.connector=smallrye-kafka
mp.messaging.incoming.orders.topic=orders
mp.messaging.incoming.orders.group.id=coolstore-orders
mp.messaging.incoming.orders.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders.auto.offset.reset=earliest
mp.messaging.incoming.orders.failure-strategy=dead-letter-queue
mp.messaging.incoming.orders.dead-letter-queue.topic=orders-dlq
# NOTE: @Incoming methods MUST be annotated with @Transactional (Amendment 1)
# because SmallRye Reactive Messaging does NOT auto-run in transactions.

# Inventory Notification Channel - Incoming (Consumer) - InventoryNotificationMDB
# [RULE: RULEBOOK.md "Messaging Connector Decision", line 212]
# Distinct consumer group preserves JMS topic broadcast semantics (NOT load-balanced).
# DO NOT merge coolstore-inventory with coolstore-orders (see TG5.3 / E2E assertion).
mp.messaging.incoming.inventory.connector=smallrye-kafka
mp.messaging.incoming.inventory.topic=orders
mp.messaging.incoming.inventory.group.id=coolstore-inventory
mp.messaging.incoming.inventory.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.inventory.auto.offset.reset=earliest
mp.messaging.incoming.inventory.failure-strategy=dead-letter-queue
mp.messaging.incoming.inventory.dead-letter-queue.topic=inventory-dlq
# NOTE: @Incoming("inventory") method in InventoryNotificationMDB MUST be @Transactional

# Kafka Bootstrap Servers (TG5.3: env-injected; dev/test overridden to in-memory below)
mp.messaging.connector.smallrye-kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Disable dev services for local testing (no Docker available)
quarkus.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
quarkus.log.level=INFO
quarkus.log.category."com.redhat.coolstore".level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# ============================================================================
# SECURITY - KEYCLOAK / OIDC (TG4.2 — ACTIVATED)
# ============================================================================
# Realm "eap", client "coolstore" (realm-export.json at repo root).
# No secrets in Git: client secret injected via COOLSTORE_OIDC_SECRET env
# (OpenShift Secret — see openshift/coolstore-secret-example.yaml).
# Endpoints: @PermitAll on /services/rest/products; @RolesAllowed("user") on
# /services/rest/cart and /services/rest/orders (original Java EE model, TG4.3).
quarkus.oidc.auth-server-url=${COOLSTORE_OIDC_AUTH_SERVER_URL:http://localhost:8081/realms/eap}
quarkus.oidc.client-id=coolstore
quarkus.oidc.credentials.secret=${COOLSTORE_OIDC_SECRET:}
quarkus.oidc.token.audience=coolstore
# CORS for the SPA frontend origin (TG4.2)
quarkus.http.cors=true
quarkus.http.cors.origins=${COOLSTORE_CORS_ORIGINS:http://localhost:8080}
quarkus.http.cors.methods=GET,HEAD,OPTIONS,POST,PUT,DELETE
# Tests run without a Keycloak (TG4.6): endpoint tests use the disabled-auth %test profile.
%test.quarkus.oidc.tenant.enabled=false

# ============================================================================
# HTTP / REST ENDPOINTS
# ============================================================================
# Base path pinned via @ApplicationPath("/services") in RestApplication (TG1.4):
# endpoints resolve to /services/rest/{products,cart,orders}.
quarkus.http.port=8080
quarkus.application.name=coolstore
quarkus.application.version=1.0.0

# ============================================================================
# DEVELOPMENT PROFILE
# ============================================================================
%dev.quarkus.log.level=DEBUG
%dev.quarkus.datasource.jdbc=false
%dev.mp.messaging.outgoing.orders.connector=smallrye-in-memory
%dev.mp.messaging.incoming.orders.connector=smallrye-in-memory
%dev.mp.messaging.incoming.inventory.connector=smallrye-in-memory

# ============================================================================
# TEST PROFILE (single test-config source; legacy test persistence.xml removed TG2.5)
# ============================================================================
# [CRITICAL FIX Reviewer 2#1,#7]: isolated H2 + in-memory messaging per rulebook §4,§8
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb-test;DB_CLOSE_DELAY=-1
%test.mp.messaging.outgoing.orders.connector=smallrye-in-memory
%test.mp.messaging.incoming.orders.connector=smallrye-in-memory
%test.mp.messaging.incoming.inventory.connector=smallrye-in-memory

# ============================================================================
# PRODUCTION DATASOURCE (TG5.1 — ACTIVATED)
# ============================================================================
# Original source: java:jboss/datasources/CoolstoreDS (PostgreSQL).
# All values env-injected via OpenShift Secret/ConfigMap — no credentials in Git.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coolstore}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:coolstore}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:}
%prod.quarkus.hibernate-orm.database.generation=validate

