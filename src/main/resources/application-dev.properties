# Quarkus Development Profile Configuration

# Dev Services - Auto-start containers in dev mode
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.port=5432
quarkus.artemis.devservices.enabled=true

# Development logging
quarkus.log.console.level=DEBUG
quarkus.log.category."com.redhat.coolstore".level=DEBUG
quarkus.hibernate-orm.log.sql=true

# Dev mode specific settings
quarkus.http.port=8080
quarkus.live-reload.password=changeit

# OIDC dev mode
quarkus.oidc.enabled=false

# Allow all CORS in dev
quarkus.http.cors=true
