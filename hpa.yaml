# HorizontalPodAutoscaler — MigIQ containerize stage.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coolstore
  namespace: coolstore-dev
  labels:
    app: coolstore
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coolstore
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
