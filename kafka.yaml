# Kafka via AMQ Streams / Strimzi (containerize stage).
# Consumer groups coolstore-orders and coolstore-inventory stay distinct in app
# config (JMS topic broadcast parity); DLQ topics provisioned here.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
  labels:
    app: coolstore
    app.kubernetes.io/name: kafka
spec:
  kafka:
    replicas: 1   # scale to 3 (and replication factors to 3) for production
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
    storage:
      type: ephemeral   # persistent-claim storage for production
  zookeeper:
    replicas: 1
    storage:
      type: ephemeral
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: orders
  labels:
    strimzi.io/cluster: my-cluster
    app: coolstore
spec:
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: orders-dlq
  labels:
    strimzi.io/cluster: my-cluster
    app: coolstore
spec:
  partitions: 1
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: inventory-dlq
  labels:
    strimzi.io/cluster: my-cluster
    app: coolstore
spec:
  partitions: 1
  replicas: 1
