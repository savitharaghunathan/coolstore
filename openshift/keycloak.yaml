# Keycloak with realm import (migration TG9.4).
# Realm JSON is NOT embedded here (59KB, and secrets must be rotated at provisioning):
#   oc create configmap keycloak-realm --from-file=realm-export.json=realm-export.json
# Admin credentials: oc create secret generic keycloak-admin --from-literal=KEYCLOAK_ADMIN=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: {app: coolstore, app.kubernetes.io/name: keycloak}
spec:
  replicas: 1
  selector:
    matchLabels: {app: coolstore, name: keycloak}
  template:
    metadata:
      labels: {app: coolstore, name: keycloak}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:20.0
          args: ["start-dev", "--import-realm"]   # production: start --optimized + TLS
          ports: [{containerPort: 8080}]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: KEYCLOAK_ADMIN}}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: KEYCLOAK_ADMIN_PASSWORD}}
          volumeMounts: [{name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}]
          readinessProbe:
            httpGet: {path: /realms/eap, port: 8080}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: {app: coolstore}
spec:
  selector: {name: keycloak}
  ports: [{port: 8080}]
