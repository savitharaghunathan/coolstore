# PostgreSQL provisioning (migration TG9.2). Credentials come from coolstore-secrets
# (keys: db-username, db-password — same Secret the app reads; POSTGRES_DB fixed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels: {app: coolstore, app.kubernetes.io/name: postgresql}
spec:
  replicas: 1
  selector:
    matchLabels: {app: coolstore, name: postgresql}
  template:
    metadata:
      labels: {app: coolstore, name: postgresql}
    spec:
      containers:
        - name: postgresql
          image: postgres:13
          ports: [{containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              value: coolstore
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: coolstore-secrets, key: db-username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: coolstore-secrets, key: db-password}}
          volumeMounts: [{name: pgdata, mountPath: /var/lib/postgresql/data}]
          readinessProbe:
            exec: {command: [pg_isready, -U, coolstore]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
      volumes:
        - name: pgdata
          persistentVolumeClaim: {claimName: postgresql-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels: {app: coolstore}
spec:
  selector: {name: postgresql}
  ports: [{port: 5432}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  labels: {app: coolstore}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
