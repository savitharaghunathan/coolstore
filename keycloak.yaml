# CoolStore — Keycloak supporting service (MigIQ containerize stage)
# Dev/test-grade Keycloak 20.0.5 (same version as the source platform, so the
# bundled realm-export.json imports cleanly). Realm `eap` imported at startup.
# For production use RH-SSO / a managed Keycloak with a real database.
#
# NON-ROOT VERIFICATION (stage requirement): quay.io/keycloak/keycloak:20.0.5
# declares USER 1000 (keycloak user) per published Keycloak container docs, so
# runAsNonRoot: true is safe. We deliberately do NOT force runAsUser: 1001 or
# readOnlyRootFilesystem: true — the entrypoint writes to /opt/keycloak/data
# (H2) as UID 1000; forcing the app's full hardening here would crash the pod.
#
# STEP 1 — create the realm ConfigMap from the repo file (not inlined to keep
# this manifest small):
#   oc create configmap keycloak-realm --from-file=realm-export.json=realm-export.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/part-of: coolstore
    app.kubernetes.io/managed-by: migiq-containerize
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/part-of: coolstore
    spec:
      securityContext:
        runAsNonRoot: true          # image default UID 1000 (non-root) — verified
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:20.0.5
        args: ["start", "--http-enabled=true", "--hostname-strict=false", "--import-realm"]
        env:
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef: { name: coolstore-secrets, key: KEYCLOAK_ADMIN }
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef: { name: coolstore-secrets, key: KEYCLOAK_ADMIN_PASSWORD }
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        readinessProbe:
          httpGet: { path: /realms/master, port: http }
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /realms/master, port: http }
          initialDelaySeconds: 60
          periodSeconds: 30
        volumeMounts:
        # H2 state is ephemeral (emptyDir) — realm is re-imported on each start.
        - name: data
          mountPath: /opt/keycloak/data
        - name: realm
          mountPath: /opt/keycloak/data/import
          readOnly: true
      volumes:
      - name: data
        emptyDir: {}
      - name: realm
        configMap:
          name: keycloak-realm
          items:
          - key: realm-export.json
            path: eap-realm.json
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/part-of: coolstore
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8080
    targetPort: http
---
# Browser-facing Route (the front-end keycloak.json adapter and the app's
# OIDC auth-server-url both point here — see CONTAINERIZATION_REPORT.md).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/part-of: coolstore
spec:
  to:
    kind: Service
    name: keycloak
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
