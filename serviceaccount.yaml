# Dedicated service account for the CoolStore workload (least privilege —
# no RBAC rules granted; OpenShift default SCC restricted-v2 applies).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coolstore
  namespace: coolstore-dev
  labels:
    app: coolstore
    app.kubernetes.io/name: coolstore
    app.kubernetes.io/part-of: coolstore
