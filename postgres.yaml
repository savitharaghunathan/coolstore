# CoolStore — PostgreSQL supporting service (MigIQ containerize stage)
# Dev/test-grade single-instance PostgreSQL. For production prefer a managed
# database or the OpenShift database operator (see CONTAINERIZATION_REPORT.md).
#
# NON-ROOT VERIFICATION (stage requirement): registry.redhat.io/rhel9/postgresql-15
# declares USER 26 (postgresql user) per published Red Hat image metadata, so
# runAsNonRoot: true is safe. We deliberately do NOT force runAsUser: 1001 or
# readOnlyRootFilesystem: true here — the image's entrypoint runs initdb as UID
# 26 and writes outside the data volume; forcing the app's full hardening onto
# this third-party image would crash the pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: coolstore
spec:
  clusterIP: None   # headless service for the StatefulSet
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: coolstore
    app.kubernetes.io/managed-by: migiq-containerize
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: coolstore
    spec:
      securityContext:
        runAsNonRoot: true          # image default UID 26 (non-root) — verified
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: registry.redhat.io/rhel9/postgresql-15:latest  # pin digest in production
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef: { name: coolstore-secrets, key: POSTGRESQL_USER }
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef: { name: coolstore-secrets, key: POSTGRESQL_PASSWORD }
        - name: POSTGRESQL_DATABASE
          value: "coolstore"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE"]
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE"]
          initialDelaySeconds: 30
          periodSeconds: 30
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
